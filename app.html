<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBAC Manager · App</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
/* theme first, before anything paints: saved choice, else the OS setting (shared with the product page) */
(function () {
  var t = '';
  try { t = localStorage.getItem('rbac-theme') || ''; } catch (e) {}
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="product-page.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* RBAC accent (violet). Colours only: every size, space and radius comes from product-page.css (shared with Roadmaps, Taskboards and Diagramico). */
[data-theme="light"]{
  --primary:#7c3aed; --primary-h:#6d28d9; --primary-ink:#ffffff;
  --primary-soft:rgba(124,58,237,.12); --glow:rgba(124,58,237,.10);
  --ok:#1f8a4c; --ok-ink:#ffffff; --inh:rgba(124,58,237,.20); --wr:#b45309;
}
[data-theme="dark"]{
  --primary:#a78bfa; --primary-h:#c4b5fd; --primary-ink:#1e1038;
  --primary-soft:rgba(167,139,250,.16); --glow:rgba(167,139,250,.12);
  --ok:#34d399; --ok-ink:#052e22; --inh:rgba(167,139,250,.30); --wr:#fbbf24;
}
html{scrollbar-gutter:stable}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
a.btn{text-decoration:none}
.tabsrow{padding-top:0;padding-bottom:0}
.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;font-weight:600;white-space:nowrap}
.tabs button:focus-visible{outline-offset:-2px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--primary-h);border-color:var(--primary)}
[data-theme="dark"] .tabs button.on{color:var(--primary)}
.intro{padding-top:20px}
.sub{color:var(--muted);margin:0}
.app{padding-top:16px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
input,select,textarea{color:var(--text);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:7px 10px;width:100%;font-size:.875rem}
label{font-size:.75rem;font-weight:500;color:var(--muted);display:block;margin:10px 0 4px}
.btn-del{color:var(--danger)}
.tag{display:inline-block;font-size:.6875rem;padding:2px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary-h);font-weight:600}
[data-theme="dark"] .tag{color:var(--primary)}
.w{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.8125rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{background:var(--surface-2);font-size:.75rem;position:sticky;top:0}
td.mod{font-weight:700;background:var(--surface-2);color:var(--muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:2px}
.chip{width:22px;height:24px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:none;color:var(--muted);font-size:.6875rem;font-weight:700;padding:0}
.chip.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.chip.inh{background:var(--inh);border-color:var(--inh);color:var(--primary-h)}
[data-theme="dark"] .chip.inh{color:var(--primary)}
.lg{font-size:.75rem;color:var(--muted);margin:0 0 8px}
.warn{color:var(--wr);font-size:.8125rem}
textarea{min-height:240px;font:.75rem/1.5 var(--mono)}
svg text{fill:var(--text);font:12px var(--font)}
.sv{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px;overflow:auto}
.hint{font-size:.8125rem;color:var(--muted);margin:0 0 12px}
.ptabsrow{padding-top:8px;padding-bottom:8px}
.ptabs{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{--tab-color:var(--primary);display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);color:var(--muted);font-size:.8125rem;font-weight:500;white-space:nowrap;user-select:none;transition:background var(--fast),color var(--fast),border-color var(--fast),box-shadow var(--fast)}
.ptab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tab-color)}
.ptab:hover{color:var(--text);background:var(--surface-3)}
.ptab[aria-pressed="true"]{background:color-mix(in srgb,var(--tab-color) 12%,var(--surface));border-color:var(--tab-color);color:color-mix(in srgb,var(--tab-color) 65%,var(--text));font-weight:600;box-shadow:var(--sh-sm)}
.ptab--icon{width:32px;padding:0;justify-content:center;border-style:dashed;background:transparent}
.ptab--icon::before{display:none}
.ptab[data-id]{cursor:grab}
.ptab.dragging{opacity:.35}
.ptab-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;box-shadow:var(--sh-lg);transform:rotate(-1.5deg)}
.ptab-marker{position:fixed;z-index:9998;width:3px;border-radius:2px;background:var(--primary);pointer-events:none;display:none}
body.tab-dragging{cursor:grabbing;user-select:none}
dialog{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);color:var(--text);padding:0;box-shadow:var(--sh-lg);width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:var(--overlay)}
.dlg{padding:20px}
.dlg h2{font-size:1.125rem;margin:0 0 6px}
.dfoot{margin-top:20px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--tab-color);padding:0}
.swb.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
@media (max-width:560px){.hide-sm{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="./">
      <span class="brand__mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      RBAC Manager
    </a>
    <span class="grow"></span>
    <a class="btn btn--text btn--sm hide-sm" href="./">About</a>
    <button class="btn btn--text btn--icon" id="themeToggle" type="button" aria-label="Toggle light / dark theme" title="Toggle theme"></button>
  </div>
  <div class="wrap ptabsrow"><div class="ptabs" id="ptabs" role="group" aria-label="Projects"></div></div>
  <div class="wrap tabsrow"><nav class="tabs" id="nav" aria-label="Steps"></nav></div>
</header>
<div class="wrap intro"><p class="sub">Roles → permissions → resources (screens and features). Least privilege, hierarchy and separation of duties.</p></div>
<main class="wrap app" id="app"></main>
<dialog id="pdlg"></dialog>
<input type="file" id="pfileinput" accept="application/json,.json" hidden>
<script>
const ACT=[['V','View'],['C','Create'],['E','Edit'],['D','Delete'],['A','Approve'],['X','Export']];
const TYPES={h:'Human',s:'Service account',a:'AI agent'};
const TABS=[['roles','1 · Roles'],['res','2 · Resources'],['mx','3 · Matrix'],['tb','4 · Table'],['dg','5 · Diagram'],['ex','6 · Export']];
const uid=()=>Math.random().toString(36).slice(2,8);
function seed(){
 const r=[{id:'r1',name:'User',desc:'Base read-only access',type:'h',scope:'Global',parent:''},
  {id:'r2',name:'Manager',desc:'Manages team and approves requests',type:'h',scope:'Global',parent:'r1'},
  {id:'r3',name:'Administrator',desc:'System configuration',type:'h',scope:'Global',parent:'r2'},
  {id:'r4',name:'AI Support Agent',desc:'Answers tickets (read-only)',type:'a',scope:'Support',parent:''}];
 const x=[{id:'x1',kind:'screen',name:'Dashboard',module:'General',risk:'Low'},
  {id:'x2',kind:'screen',name:'Invoice List',module:'Finance',risk:'Medium'},
  {id:'x3',kind:'feature',name:'Approve payment',module:'Finance',risk:'High'},
  {id:'x4',kind:'screen',name:'User Management',module:'Admin',risk:'High'},
  {id:'x5',kind:'screen',name:'Tickets',module:'Support',risk:'Low'}];
 return{roles:r,res:x,perm:{'r1|x1':'V','r1|x5':'V','r2|x2':'VCE','r2|x3':'VA','r3|x4':'VCED','r3|x2':'X','r4|x5':'V'},sod:[]};
}
const HUES=[262,160,200,28,330,95,0,220];
const MAPS={'Utilizador':'User','Acesso base de leitura':'Base read-only access','Gestor':'Manager','Gere equipa e aprova pedidos':'Manages team and approves requests','Administrador':'Administrator','Configuração do sistema':'System configuration','Agente IA Suporte':'AI Support Agent','Responde a tickets (só leitura)':'Answers tickets (read-only)','Suporte':'Support','Geral':'General','Lista de Faturas':'Invoice List','Financeiro':'Finance','Aprovar pagamento':'Approve payment','Gestão de Utilizadores':'User Management','Novo papel':'New role','Novo ecrã':'New screen','Nova funcionalidade':'New feature'},RISKS={Baixo:'Low','Médio':'Medium',Alto:'High'};
// Validates and normalises a project (from storage, a file or a backup); returns null when it is not one.
function clean(j,nm){
 if(!j||typeof j!=='object'||!Array.isArray(j.roles)||!Array.isArray(j.res))return null;
 const str=(v,n)=>String(v??'').slice(0,n),seen=new Set(),id=(v,d)=>{let x=/^[\w-]{1,24}$/.test(String(v))?String(v):d+uid();while(seen.has(x))x=d+uid();seen.add(x);return x};
 const tr=v=>MAPS[v]||v;
 const roles=j.roles.filter(r=>r&&typeof r==='object').slice(0,200).map(r=>({id:id(r.id,'r'),name:tr(str(r.name,80)),desc:tr(str(r.desc,300)),type:TYPES[r.type]?r.type:'h',scope:tr(str(r.scope,80)),parent:str(r.parent,24)}));
 const rid=new Set(roles.map(r=>r.id));roles.forEach(r=>{if(!rid.has(r.parent)||r.parent===r.id)r.parent=''});
 seen.clear();
 const res=j.res.filter(x=>x&&typeof x==='object').slice(0,500).map(x=>{const risk=RISKS[x.risk]||x.risk;return{id:id(x.id,'x'),kind:x.kind==='feature'?'feature':'screen',name:tr(str(x.name,80)),module:tr(str(x.module,80)),risk:['Low','Medium','High'].includes(risk)?risk:'Low'}});
 const xid=new Set(res.map(x=>x.id)),perm={};
 Object.entries(j.perm&&typeof j.perm==='object'?j.perm:{}).forEach(([k,v])=>{const[r,x]=k.split('|');const l=ACT.map(z=>z[0]).filter(c=>String(v).includes(c)).join('');if(rid.has(r)&&xid.has(x)&&l)perm[k]=l});
 const sod=(Array.isArray(j.sod)?j.sod:[]).filter(q=>Array.isArray(q)&&q.length===2).map(q=>[String(q[0]),String(q[1])]);
 return{id:/^[\w-]{1,24}$/.test(String(j.id))?String(j.id):'p'+uid(),name:str(j.name,40).trim()||nm,hue:Number.isInteger(j.hue)&&j.hue>=0&&j.hue<360?j.hue:null,auto:HUES.includes(j.auto)?j.auto:null,roles,res,perm,sod};
}
let P={current:'',projects:[]};
try{const j=JSON.parse(localStorage.getItem('rbac2'));if(j&&Array.isArray(j.projects)){P.current=String(j.current||'');P.projects=j.projects.map((q,i)=>clean(q,'Project '+(i+1))).filter(Boolean)}}catch(e){}
if(!P.projects.length){let o=null;try{o=JSON.parse(localStorage.getItem('rbac1'))}catch(e){}const m=clean(o,'My project');P.projects=[m||{...seed(),id:'p'+uid(),name:'Example',hue:null}]}
let S=P.projects.find(q=>q.id===P.current)||P.projects[0];P.current=S.id;
let tab='roles',fRole='',fMod='',out='md',diaMode='own';
const save=()=>{try{localStorage.setItem('rbac2',JSON.stringify(P))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=id=>S.roles.find(r=>r.id===id);
const own=(r,x)=>S.perm[r+'|'+x]||'';
function anc(rid){const o=[];let c=R(rid)?.parent;while(c&&!o.includes(c)&&c!==rid){o.push(c);c=R(c)?.parent}return o}
function eff(r,x){const s=new Set(own(r,x));anc(r).forEach(a=>[...own(a,x)].forEach(l=>s.add(l)));return ACT.map(a=>a[0]).filter(l=>s.has(l)).join('')}
const mods=()=>[...new Set(S.res.map(x=>x.module||'—'))];
const sorted=()=>[...S.res].sort((a,b)=>(a.module||'').localeCompare(b.module||''));

document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
document.getElementById('nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};

function render(){
 renderProjects();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const f={roles:vRoles,res:vRes,mx:vMx,tb:vTb,dg:vDg,ex:vEx}[tab];
 document.getElementById('app').innerHTML=f();
 if(tab==='dg')document.getElementById('app').querySelector('.sv').innerHTML=svg();
 save();
}

function vRoles(){
 const o=(sel,ex)=>'<option value="">— none —</option>'+S.roles.filter(r=>r.id!==ex).map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('');
 return `<p class="hint">Step 1 — Define roles by business function, not by menus. Use inheritance to avoid duplication (e.g. Manager inherits from User).</p>
 <div class="row" style="margin-bottom:12px"><button class="btn btn--primary" data-a="addRole">+ New role</button></div>
 <div class="grid">${S.roles.map(r=>`<div class="card">
  <div class="row" style="justify-content:space-between"><span class="tag">${TYPES[r.type]}</span><button class="btn btn--outline btn-del" data-a="delRole" data-id="${r.id}">Delete</button></div>
  <label>Name</label><input data-f="roles.name" data-id="${r.id}" value="${esc(r.name)}">
  <label>Description / responsibilities</label><input data-f="roles.desc" data-id="${r.id}" value="${esc(r.desc)}">
  <label>Scope (Global or domain/application)</label><input data-f="roles.scope" data-id="${r.id}" value="${esc(r.scope)}">
  <label>Identity type</label><select data-f="roles.type" data-id="${r.id}">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===r.type?'selected':''}>${v}</option>`).join('')}</select>
  <label>Inherits from (hierarchy)</label><select data-f="roles.parent" data-id="${r.id}">${o(r.parent,r.id)}</select>
 </div>`).join('')}</div>
 <div class="card"><b>Separation of duties (SoD)</b><p class="lg">Pairs of mutually exclusive roles (e.g. Requester ≠ Approver).</p>
 ${S.sod.map((p,i)=>{const bad=anc(p[0]).includes(p[1])||anc(p[1]).includes(p[0]);return `<div class="row" style="margin-bottom:6px"><select data-f="sod0" data-i="${i}" style="flex:1">${o(p[0],'')}</select><span>⊥</span><select data-f="sod1" data-i="${i}" style="flex:1">${o(p[1],'')}</select><button class="btn btn--outline btn-del" data-a="delSod" data-i="${i}">✕</button></div>${bad?'<div class="warn">⚠ Conflict: one of the roles inherits from the other.</div>':''}`}).join('')}
 <button class="btn btn--outline" data-a="addSod">+ Constraint</button></div>`;
}

function vRes(){
 return `<p class="hint">Step 2 — Register the screens and features to protect. Set the risk level to focus reviews on sensitive resources.</p>
 <div class="row" style="margin-bottom:12px"><button class="btn btn--primary" data-a="addRes" data-k="screen">+ Screen</button><button class="btn btn--outline" data-a="addRes" data-k="feature">+ Feature</button></div>
 <div class="w"><table><tr><th>Type</th><th>Name</th><th>Module</th><th>Risk</th><th></th></tr>
 ${S.res.map(x=>`<tr><td><select data-f="res.kind" data-id="${x.id}"><option value="screen" ${x.kind==='screen'?'selected':''}>Screen</option><option value="feature" ${x.kind==='feature'?'selected':''}>Feature</option></select></td>
 <td><input data-f="res.name" data-id="${x.id}" value="${esc(x.name)}"></td>
 <td><input data-f="res.module" data-id="${x.id}" value="${esc(x.module)}"></td>
 <td><select data-f="res.risk" data-id="${x.id}">${['Low','Medium','High'].map(v=>`<option ${v===x.risk?'selected':''}>${v}</option>`).join('')}</select></td>
 <td><button class="btn btn--outline btn-del" data-a="delRes" data-id="${x.id}">✕</button></td></tr>`).join('')}</table></div>`;
}

const legend=()=>`<p class="lg">${ACT.map(a=>`<b>${a[0]}</b>=${a[1]}`).join(' · ')} &nbsp;|&nbsp; green = assigned · violet = inherited</p>`;

function vMx(){
 let h=`<p class="hint">Step 3 — Click the letters to grant permissions to each role on each resource.</p>${legend()}<div class="w"><table><tr><th>Resource</th>${S.roles.map(r=>`<th>${esc(r.name)}</th>`).join('')}</tr>`;
 let m=null;
 sorted().forEach(x=>{
  if(x.module!==m){m=x.module;h+=`<tr><td class="mod" colspan="${S.roles.length+1}">${esc(m||'—')}</td></tr>`}
  h+=`<tr><td>${x.kind==='screen'?'🖥️':'⚙️'} ${esc(x.name)}${x.risk==='High'?' <span class="warn">●</span>':''}</td>`+S.roles.map(r=>{
   const o=own(r.id,x.id),e=eff(r.id,x.id);
   return `<td><div class="chips">${ACT.map(a=>`<button class="chip ${o.includes(a[0])?'on':e.includes(a[0])?'inh':''}" title="${a[1]}" data-a="tg" data-r="${r.id}" data-x="${x.id}" data-l="${a[0]}">${a[0]}</button>`).join('')}</div></td>`}).join('')+'</tr>';
 });
 return h+'</table></div>';
}

function vTb(){
 const rs=fRole?S.roles.filter(r=>r.id===fRole):S.roles;
 let rows='';
 rs.forEach(r=>sorted().forEach(x=>{
  if(fMod&&x.module!==fMod)return;const e=eff(r.id,x.id);if(!e)return;
  rows+=`<tr><td><b>${esc(r.name)}</b></td><td>${TYPES[r.type]}</td><td>${esc(x.module)}</td><td>${x.kind==='screen'?'Screen':'Feature'}</td><td>${esc(x.name)}</td><td>${[...e].map(l=>ACT.find(a=>a[0]===l)[1]).join(', ')}</td><td>${esc(x.risk)}</td></tr>`}));
 return `<div class="row" style="margin-bottom:12px"><select data-fl="role" style="flex:1;min-width:140px"><option value="">All roles</option>${S.roles.map(r=>`<option value="${r.id}" ${r.id===fRole?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
 <select data-fl="mod" style="flex:1;min-width:140px"><option value="">All modules</option>${mods().map(m=>`<option ${m===fMod?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
 <div class="w"><table><tr><th>Role</th><th>Identity</th><th>Module</th><th>Type</th><th>Resource</th><th>Permissions (effective)</th><th>Risk</th></tr>${rows||'<tr><td colspan="7">No permissions assigned.</td></tr>'}</table></div>`;
}

function svg(){
 const RH=58,XH=34,top=30,rn=S.roles.length,xs=sorted(),H=Math.max(rn*RH,xs.length*XH)+top+20,W=800;
 const col=i=>`hsl(${(i*67+220)%360} 65% 52%)`;
 const ry=i=>top+i*RH+RH/2, xy=i=>top+i*XH+XH/2;
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" style="min-width:${W}px;max-width:100%"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="#888"/></marker></defs>
 <text x="70" y="16" font-weight="700">ROLES</text><text x="540" y="16" font-weight="700">RESOURCES</text>`;
 S.roles.forEach((r,i)=>{const p=S.roles.findIndex(q=>q.id===r.parent);if(p>=0)s+=`<path d="M70,${ry(i)} C10,${ry(i)} 10,${ry(p)} 70,${ry(p)}" fill="none" stroke="#888" stroke-dasharray="4 3" marker-end="url(#ar)"/>`});
 const pills=[],pc=i=>`hsl(${(i*67+220)%360} 65% 40%)`;
 S.roles.forEach((r,i)=>xs.forEach((x,j)=>{const p=diaMode==='own'?own(r.id,x.id):eff(r.id,x.id);if(!p)return;
  const y1=ry(i),y2=xy(j),w=14+p.length*7;
  s+=`<path d="M240,${y1} C380,${y1} 400,${y2} 530,${y2}" fill="none" stroke="${col(i)}" stroke-width="1.6" opacity=".7"/>`;
  pills.push({y:y2,w,c:pc(i),t:p,j});}));
 xs.forEach((x,j)=>{let xe=522;pills.filter(q=>q.j===j).forEach(q=>{s+=`<rect x="${xe-q.w}" y="${q.y-9}" width="${q.w}" height="18" rx="9" style="fill:${q.c}"/><text x="${xe-q.w/2}" y="${q.y+4}" text-anchor="middle" font-size="10" style="fill:#fff;font-weight:700">${q.t}</text>`;xe-=q.w+4})});

   body:sorted().map(x=>[T(x.module),x.kind==='screen'?'Screen':'Feature',T(x.name),T(x.risk),...S.roles.map(r=>eff(r.id,x.id)||'-')]),

  else{

const hueOf=p=>p.hue??p.auto;
// every project gets its own automatic colour once (the least used one), so reordering never recolours a tab
function fillAuto(){const n=h=>P.projects.filter(q=>q.auto===h||q.hue===h).length;P.projects.forEach(q=>{if(!HUES.includes(q.auto)){q.auto=null;q.auto=HUES.reduce((a,h)=>n(h)<n(a)?h:a,HUES[0])}})}
const blank=name=>({id:'p'+uid(),name,hue:null,roles:[],res:[],perm:{},sod:[]});

function renderProjects(){
 fillAuto();
 const box=document.getElementById('ptabs'),mk=(c,t,x)=>{const b=document.createElement('button');b.type='button';b.className=c;b.textContent=t;Object.assign(b,x);return b};
 box.replaceChildren(...P.projects.map(p=>{const b=mk('ptab',p.name,{title:'Click to open · drag to reorder · right-click to edit'});b.dataset.id=p.id;b.setAttribute('aria-pressed',String(p===S));b.style.setProperty('--tab-color',`hsl(${hueOf(p)} 70% 55%)`);return b}),
  mk('ptab ptab--icon','+',{id:'padd',title:'New project','aria-label':'New project'}),mk('ptab ptab--icon','⋯',{id:'pedit',title:'Edit this project','aria-label':'Edit this project'}));

function loadFile(f,done){
 if(!f)return;
 if(f.size>5e6){done('That file is too large.');return}
 f.text().then(t=>{let j;try{j=JSON.parse(t)}catch(_){done('That file is not valid JSON.');return}
  const n=addProjects(j);done(n?(n===1?'Project loaded ✔':n+' projects loaded ✔'):'No RBAC project found in that file.')}).catch(()=>done('Could not read the file.'));

  ${isNew?'<label>Or start from a file</label><div class="row"><button type="button" class="btn btn--outline" id="pfile">Load project from JSON file…</button></div><p class="lg" id="pmsg" style="margin-top:8px"></p>':''}
  <div class="row dfoot">${isNew?'':'<button type="button" class="btn btn--text btn-del" id="pdel">Delete</button><button type="button" class="btn btn--text" id="pdup">Duplicate</button>'}<span class="grow"></span><button type="button" class="btn btn--text" id="pcancel">Cancel</button><button type="button" class="btn btn--primary" id="psave">${isNew?'Create project':'Save'}</button></div></form>`;
 const q=id=>dlg.querySelector('#'+id),close=()=>dlg.close(),name=q('pname');

 else{
  const arrows=()=>{const i=P.projects.indexOf(p),l=q('pl'),r=q('pr');if(l)l.disabled=i<1;if(r)r.disabled=i>=P.projects.length-1};

function moveProject(id,to){

// drag a tab to reorder (mouse and pen; on touch use Move left / Move right in the edit dialog)
let tdrag=null,noClickUntil=0;
function endDrag(){
 const d=tdrag;if(!d)return;
 d.ghost&&d.ghost.remove();d.marker&&d.marker.remove();document.body.classList.remove('tab-dragging');
 document.querySelectorAll('.ptab.dragging').forEach(t=>t.classList.remove('dragging'));
 document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragUp);document.removeEventListener('pointercancel',dragUp);
 tdrag=null;
}
function dragMove(e){
 const d=tdrag;if(!d)return;
 if(!d.on){
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6)return;
  if(P.projects.length<2){endDrag();return}
  d.on=true;const r=d.el.getBoundingClientRect();d.dx=d.x-r.left;
  d.ghost=d.el.cloneNode(true);d.ghost.classList.add('ptab-ghost');d.ghost.style.width=r.width+'px';d.ghost.style.height=r.height+'px';document.body.append(d.ghost);
  d.marker=document.createElement('div');d.marker.className='ptab-marker';document.body.append(d.marker);
  d.el.classList.add('dragging');document.body.classList.add('tab-dragging');
 }
 e.preventDefault();
 const bar=document.getElementById('ptabs').getBoundingClientRect();
 d.ghost.style.left=(e.clientX-d.dx)+'px';d.ghost.style.top=bar.top+'px';
 const others=[...document.querySelectorAll('#ptabs .ptab[data-id]')].filter(t=>t.dataset.id!==d.id);
 const inBar=e.clientY>bar.top-50&&e.clientY<bar.bottom+50;   // let go far away = cancel
 if(!inBar||!others.length){d.idx=null;d.marker.style.display='none';return}
 let k=0;while(k<others.length){const r=others[k].getBoundingClientRect();if(e.clientX<r.left+r.width/2)break;k++}
 d.idx=k;const ref=k<others.length?others[k]:others[others.length-1],r=ref.getBoundingClientRect();
 d.marker.style.left=((k<others.length?r.left:r.right)-4)+'px';d.marker.style.top=r.top+'px';d.marker.style.height=r.height+'px';d.marker.style.display='block';
}
function dragUp(e){
 const d=tdrag;if(!d)return;
 const commit=d.on&&e.type==='pointerup'&&d.idx!=null,{id,idx,on}=d;

const app=document.getElementById('app');
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a==='pdf'){pdf();return}
 if(a==='addRole')S.roles.push({id:'r'+uid(),name:'New role',desc:'',type:'h',scope:'Global',parent:''});
 else if(a==='delRole'){if(!confirm('Delete this role?'))return;S.roles=S.roles.filter(r=>r.id!==d.id);S.roles.forEach(r=>{if(r.parent===d.id)r.parent=''});S.sod=S.sod.filter(p=>!p.includes(d.id));Object.keys(S.perm).forEach(k=>{if(k.startsWith(d.id+'|'))delete S.perm[k]})}
 else if(a==='addSod')S.sod.push(['','']);
 else if(a==='delSod')S.sod.splice(+d.i,1);
 else if(a==='addRes')S.res.push({id:'x'+uid(),kind:d.k,name:d.k==='screen'?'New screen':'New feature',module:'General',risk:'Low'});
 else if(a==='delRes'){S.res=S.res.filter(x=>x.id!==d.id);Object.keys(S.perm).forEach(k=>{if(k.endsWith('|'+d.id))delete S.perm[k]})}
 else if(a==='tg'){const k=d.r+'|'+d.x;let s=new Set(S.perm[k]||'');s.has(d.l)?s.delete(d.l):s.add(d.l);const v=ACT.map(z=>z[0]).filter(l=>s.has(l)).join('');v?S.perm[k]=v:delete S.perm[k]}
 else if(a==='out')out=d.k;
 else if(a==='copy'){const t=document.getElementById('ta');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}try{navigator.clipboard.writeText(t.value);ok=true}catch(_){}document.getElementById('msg').textContent=ok?'Copied ✔':'Select the text and copy it manually.';return}
 else if(a==='load'){pickFile(m=>{const e=document.getElementById('msg');if(e)e.textContent=m});return}

app.addEventListener('change',e=>{
